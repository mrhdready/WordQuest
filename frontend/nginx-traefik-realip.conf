# Nur fuer den Traefik-Stack (docker-compose.yml bindet die Datei als
# /etc/nginx/conf.d/realip.conf ein), nie im Heimnetz-Stack: Dort erreichen
# Geraete aus privaten Netzen nginx direkt und koennten ihre Adresse sonst
# selbst waehlen.
#
# Traefik uebernimmt eingehende X-Forwarded-For-Koepfe ohne
# forwardedHeaders.trustedIPs nicht und setzt die Adresse des Geraets.
# real_ip_recursive off nimmt den letzten Wert, also den von Traefik; ein vom
# Geraet vorangestellter Wert zaehlt nicht. nginx reicht danach genau diese
# Adresse an die API weiter (FIX-01).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
