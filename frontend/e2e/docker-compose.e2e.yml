# WordQuest — Teststack fuer die Playwright-/axe-Laeufe.
#
# NUR FUER TESTS. Die Passwoerter und Schluessel hier sind reine Testwerte und
# werden in keiner Betriebsdatei verwendet. Port nur an 127.0.0.1 gebunden.
# Baut die Images aus dem Arbeitsbaum:
#   npm --prefix frontend run e2e:stack

name: wordquest-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD: e2e-db-testpasswort-nicht-fuer-betrieb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordquest -d wordquest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      WQ_DB_HOST: db
      WQ_DB_NAME: wordquest
      WQ_DB_USER: wordquest
      WQ_DB_PASSWORD: e2e-db-testpasswort-nicht-fuer-betrieb
      WQ_JWT_SIGNING_KEY: e2e-jwt-testschluessel-nur-fuer-playwright-laeufe-0001
      WQ_TIMEZONE: Europe/Berlin
      WQ_AI_PROVIDER: none
      # Demo-Seed bleibt Entwickler-/Test-Option (D-16).
      WQ_SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      api:
        condition: service_healthy
