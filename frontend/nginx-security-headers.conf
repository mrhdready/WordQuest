# Sicherheits-Header fuer jede Antwort von nginx (D-12, D-21). Eingebunden in beiden
# server-Bloecken von nginx.conf und in jeder location mit eigenem add_header.
#
# Die CSP erlaubt bewusst kein inline-Skript:
# damit bleibt XSS die Ausnahme statt der Regel - siehe die Abwaegung
# zur Tokenhaltung in src/lib/api.ts.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
