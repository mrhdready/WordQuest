server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header (CSP und Co.) aus einer Datei, siehe nginx-security-headers.conf.
    # Eine location mit eigenem add_header erbt die Koepfe des server-Blocks nicht;
    # deshalb bindet jede solche location die Datei selbst ein (D-21).
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Gehashte Assets duerfen lange liegen bleiben.
    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Der Service Worker niemals - sonst bekommt niemand je ein Update.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx ist die Grenze zum Heimnetz: Die API soll genau eine Adresse
        # sehen, die nginx selbst festgestellt hat, nie einen Wert vom Geraet.
        # Danach richtet sich das Anmelde-Limit pro Geraet (FIX-01).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        # Wie /api/: kein Wert vom Geraet erreicht die API (W-4).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA-Fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
