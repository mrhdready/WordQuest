# Template: Der Start des nginx-Images ersetzt per envsubst nur Variablen mit dem
# Praefix WQ_ (NGINX_ENVSUBST_FILTER im Dockerfile); nginx-Variablen bleiben.
#
# Zertifikat ueber eine Variable: nginx liest die Datei dann bei jedem Handshake
# neu, eine Erneuerung durch den Dienst certs braucht keinen Reload (TLS-02).
map $ssl_server_name $wq_tls_file {
    default /etc/nginx/tls/server.pem;
}

# HTTP nur fuer die Umleitung und den CA-Download (OD-2, TLS-03). Kein
# Strict-Transport-Security, weder hier noch auf HTTPS (Owner 2026-10-25): Sonst
# liesse sich die Zertifikatswarnung auf Geraeten ohne installierte CA nicht mehr
# wegklicken.
server {
    listen 8080;
    server_name _;

    include /etc/nginx/security-headers.conf;

    # Ein Geraet laedt die CA, bevor es dem Zertifikat vertraut.
    location = /wordquest-ca.crt {
        alias /etc/nginx/tls/wordquest-ca.crt;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Ziel ist der veroeffentlichte HTTPS-Port (WQ_HTTPS_PORT). Auch 443 steht in der
    # Location; Browser zeigen den Standardport nicht an.
    location / {
        return 301 https://$host:${WQ_HTTPS_PORT}$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    # server.pem enthaelt Zertifikat und Schluessel, geschrieben von `tls watch`.
    ssl_certificate $wq_tls_file;
    ssl_certificate_key $wq_tls_file;
    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header (CSP und Co.) aus einer Datei, siehe nginx-security-headers.conf.
    # Eine location mit eigenem add_header erbt die Koepfe des server-Blocks nicht;
    # deshalb bindet jede solche location die Datei selbst ein (D-21).
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Gehashte Assets duerfen lange liegen bleiben.
    location /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Der Service Worker niemals - sonst bekommt niemand je ein Update.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        expires -1;
    }

    # Die Zertifizierungsstelle zum Installieren auf den Geraeten, wie im HTTP-Block
    # (TLS-04). Nur das Zertifikat, der Schluessel liegt nie in diesem Volume.
    location = /wordquest-ca.crt {
        alias /etc/nginx/tls/wordquest-ca.crt;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx ist die Grenze zum Heimnetz: Die API soll genau eine Adresse
        # sehen, die nginx selbst festgestellt hat, nie einen Wert vom Geraet.
        # Danach richtet sich das Anmelde-Limit pro Geraet (FIX-01).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        # Wie /api/: kein Wert vom Geraet erreicht die API (W-4).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA-Fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
