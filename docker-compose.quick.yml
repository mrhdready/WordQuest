# WordQuest — Betrieb im Heimnetz ueber HTTPS mit eigener Zertifizierungsstelle.
#
# Eingerichtet wird im entpackten Release-Paket mit:
#
#   ./setup.sh
#
# setup.sh erzeugt DB-Passwort und JWT-Schluessel als Dateien in ./secrets,
# legt .env an (COMPOSE_FILE zeigt auf diese Datei), traegt die Namen und
# Adressen des Geraets fuer das Zertifikat ein und fragt nach dem Elternkonto.
# Danach: https://<host> (Ports 80 und 443, bei Belegung 8080 und 8443).
#
# Der Dienst certs legt beim ersten Start eine eigene Zertifizierungsstelle (CA)
# an und stellt daraus das Zertifikat fuer WordQuest aus. Bis die CA auf einem
# Geraet installiert ist, warnt dessen Browser beim ersten Besuch; die CA gibt
# es unter http://<host>/wordquest-ca.crt.
#
# Der Dienst backup sichert die Datenbank taeglich nach ./backups
# (14 Tage, 8 Wochen, 6 Monate). Die CA liegt nicht in den Sicherungen.
#
# Was ohne installierte CA NICHT geht:
#   - Die App laesst sich nicht als PWA aufs Tablet legen. Service Worker
#     brauchen ein Zertifikat, dem der Browser vertraut. Im Browser laeuft
#     alles, aber ohne Installation und ohne Offlinebetrieb.

name: wordquest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordquest -d wordquest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${WQ_IMAGE_PREFIX:-ghcr.io/mrhdready/wordquest}-api:${WQ_VERSION:-1.0.1}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      WQ_DB_HOST: db
      WQ_DB_NAME: wordquest
      WQ_DB_USER: wordquest
      WQ_DB_PASSWORD_FILE: /run/secrets/db_password
      WQ_JWT_SIGNING_KEY_FILE: /run/secrets/jwt_key
      WQ_TIMEZONE: ${WQ_TIMEZONE:-Europe/Berlin}
      WQ_AI_PROVIDER: none
      # Demo-Daten nur fuer Entwicklung und Tests.
      WQ_SEED_DEMO_DATA: ${WQ_SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Einziger Schreiber der Zertifikate (`tls watch`, API-Image). Laeuft als root
  # fuer die frisch angelegten, root-eigenen Volumes; Gruppe 101 ist nginx im
  # Web-Image und liest server.pem (0640) ueber die Gruppe. Ohne Netz: certs
  # braucht keins, und der CA-Schluessel ist von aussen nicht erreichbar.
  # Nur certs bindet das CA-Volume ein (Proxy-Gate).
  certs:
    image: ${WQ_IMAGE_PREFIX:-ghcr.io/mrhdready/wordquest}-api:${WQ_VERSION:-1.0.1}
    command: ["tls", "watch"]
    user: "0:101"
    network_mode: none
    environment:
      # setup.sh traegt die Namen und Adressen des Geraets in .env ein.
      WQ_TLS_NAMES: ${WQ_TLS_NAMES:-localhost,127.0.0.1}
    volumes:
      - tls-ca:/certs/ca
      - tls:/certs/tls
    # Sonst erbte certs den HTTP-Healthcheck des API-Images und gaelte nie als gesund.
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    image: ${WQ_IMAGE_PREFIX:-ghcr.io/mrhdready/wordquest}-web:${WQ_VERSION:-1.0.1}
    ports:
      - "${WQ_HTTP_PORT:-80}:8080"
      - "${WQ_HTTPS_PORT:-443}:8443"
    environment:
      # Ziel der Umleitung von HTTP: der veroeffentlichte HTTPS-Port oben.
      WQ_HTTPS_PORT: ${WQ_HTTPS_PORT:-443}
    volumes:
      - tls:/etc/nginx/tls:ro
    depends_on:
      - api
      - certs
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
    restart: unless-stopped

volumes:
  pgdata:
  tls-ca:
  tls:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_key:
    file: ./secrets/jwt_key.txt
