# WordQuest — Betrieb im Heimnetz ueber HTTP (Standard).
#
# Eingerichtet wird im entpackten Release-Paket mit:
#
#   ./setup.sh
#
# setup.sh erzeugt DB-Passwort und JWT-Schluessel als Dateien in ./secrets,
# legt .env an (COMPOSE_FILE zeigt auf diese Datei) und fragt nach dem
# Elternkonto. Danach: http://<host>:8080
#
# Der Dienst backup sichert die Datenbank taeglich nach ./backups
# (14 Tage, 8 Wochen, 6 Monate).
#
# Was damit NICHT geht:
#   - Die App laesst sich nicht als PWA aufs Tablet legen. Service Worker
#     brauchen HTTPS (Ausnahme: localhost). Im Browser laeuft alles, aber
#     ohne Installation und ohne Offlinebetrieb.
# Mit Domain und Zertifikat (fuer Fortgeschrittene): docker-compose.yml.

name: wordquest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordquest -d wordquest"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    image: ${WQ_IMAGE_PREFIX:-ghcr.io/mrhdready/wordquest}-api:${WQ_VERSION:-1.0.0}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      WQ_DB_HOST: db
      WQ_DB_NAME: wordquest
      WQ_DB_USER: wordquest
      WQ_DB_PASSWORD_FILE: /run/secrets/db_password
      WQ_JWT_SIGNING_KEY_FILE: /run/secrets/jwt_key
      WQ_TIMEZONE: ${WQ_TIMEZONE:-Europe/Berlin}
      WQ_AI_PROVIDER: none
      # Demo-Daten nur fuer Entwicklung und Tests.
      WQ_SEED_DEMO_DATA: ${WQ_SEED_DEMO_DATA:-false}
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
      - jwt_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    image: ${WQ_IMAGE_PREFIX:-ghcr.io/mrhdready/wordquest}-web:${WQ_VERSION:-1.0.0}
    ports:
      - "${WQ_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: wordquest
      POSTGRES_USER: wordquest
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_password
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_key:
    file: ./secrets/jwt_key.txt
