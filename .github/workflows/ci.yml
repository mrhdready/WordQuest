name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest
    # Integrationstests (WordQuest.Api.Tests) laufen gegen echtes PostgreSQL.
    # Das Passwort gilt nur fuer diesen CI-Dienst.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wordquest
          POSTGRES_USER: wordquest
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordquest -d wordquest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WQ_TEST_DB: Host=localhost;Port=5432;Username=wordquest;Password=devpassword
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Build und Tests laufen auch ohne Migration durch - erst der Container
      # scheitert dann beim Start. Deshalb hier explizit pruefen.
      - name: Migration vorhanden?
        run: |
          if ! ls backend/src/WordQuest.Infrastructure/Migrations/*.cs >/dev/null 2>&1; then
            echo "::error::Keine EF-Core-Migration im Repository. Erzeugen mit:"
            echo "::error::dotnet ef migrations add Initial --project src/WordQuest.Infrastructure --startup-project src/WordQuest.Api"
            exit 1
          fi

      - name: Restore
        run: dotnet restore backend/WordQuest.slnx

      - name: Build
        run: dotnet build backend/WordQuest.slnx --no-restore -c Release /warnaserror

      - name: Test
        run: >
          dotnet test backend/WordQuest.slnx --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-test-results
          path: "**/TestResults/**"

  frontend:
    name: Frontend (lint, build, test & design)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # DESIGN.md-Lint und -Export (npx @google/design.md, gepinnte Version in package.json).
      - run: npm run design:check
      - run: npm run design:classes

  images:
    name: Container images
    # Images nur vom Hauptbranch und von Tags bauen - nicht aus Pull Requests
    # fremder Forks, die sonst Schreibrechte auf die Registry bekaemen.
    if: github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
          - name: web
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # arm64 fuer Raspberry Pi 5 / ARM-NAS, siehe Konzept §14.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
